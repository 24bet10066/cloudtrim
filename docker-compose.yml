services:
  postgres:
    image: postgres:16
    container_name: cloudtrim-postgres
    environment:
      POSTGRES_DB: cloudtrim
      POSTGRES_USER: cloudtrim
      POSTGRES_PASSWORD: cloudtrim
    ports:
      - "5432:5432"
    volumes:
      - cloudtrim-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudtrim -d cloudtrim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudtrim-postgres-data:
