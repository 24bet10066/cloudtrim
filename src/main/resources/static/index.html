<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudTrim — Cloud Cost Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <main class="max-w-6xl mx-auto px-6 py-10">
    <header class="flex items-center justify-between mb-10">
      <div><p class="text-cyan-400 text-sm font-semibold">CLOUDTRIM</p><h1 class="text-3xl font-bold">Cost Intelligence</h1></div>
      <button id="demo" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-3 rounded-lg">Launch Live Demo</button>
    </header>
    <section class="grid md:grid-cols-4 gap-4 mb-8" id="kpis"></section>
    <section class="bg-slate-900 border border-slate-800 rounded-xl p-6">
      <h2 class="font-semibold text-xl mb-4">Waste findings</h2>
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-slate-400"><tr><th class="text-left py-2">Finding</th><th>Severity</th><th>Status</th><th class="text-right">Monthly waste</th></tr></thead><tbody id="findings"></tbody></table></div>
    </section>
  </main>
  <script>
    const tokenKey = "cloudtrim_token";
    async function api(path, options = {}) {
      const token = localStorage.getItem(tokenKey);
      const headers = Object.assign({"Content-Type":"application/json"}, options.headers || {});
      if (token) headers.Authorization = "Bearer " + token;
      const response = await fetch(path, Object.assign({}, options, {headers}));
      if (!response.ok) throw new Error(await response.text());
      return response.json();
    }
    async function demo() {
      try {
        const reg = await api("/api/auth/register", {method:"POST", body:JSON.stringify({
          tenantName:"Recruiter Live Demo", tenantSlug:"demo-"+Date.now(),
          email:"demo-"+Date.now()+"@cloudtrim.local", password:"DemoPass123!"
        })});
        localStorage.setItem(tokenKey, reg.accessToken);
        await api("/api/scan/demo", {method:"POST"});
        await api("/api/dashboard");
        await api("/api/digest/weekly");
        await refresh();
      } catch (error) { alert(error.message); }
    }
    async function refresh() {
      try {
        const summary = await api("/api/dashboard");
        document.getElementById("kpis").innerHTML = [
          ["Monthly spend", "$"+summary.totalMonthlyCloudSpendUsd],
          ["Detected waste", "$"+summary.detectedMonthlyWasteUsd],
          ["Savings potential", summary.savingsPercent+"%"],
          ["Realized savings", "$"+summary.realizedSavingsUsd]
        ].map(x=>`<article class="bg-slate-900 border border-slate-800 rounded-xl p-5"><p class="text-slate-400">${x[0]}</p><p class="text-2xl font-bold mt-2">${x[1]}</p></article>`).join("");
        const findings = await api("/api/findings");
        document.getElementById("findings").innerHTML = findings.length ? findings.map(f=>`
          <tr class="border-t border-slate-800"><td class="py-3">${f.title||f.ruleCode}</td><td class="text-center">${f.severity}</td><td class="text-center">${f.status}</td><td class="text-right">$${f.monthlyWasteUsd}</td></tr>`).join("") : `<tr><td colspan="4" class="text-slate-400 py-6 text-center">No findings yet. Launch the demo to scan inventory.</td></tr>`;
      } catch (_) {}
    }
    document.getElementById("demo").addEventListener("click", demo);
    refresh();
  </script>
</body>
</html>
